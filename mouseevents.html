<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse events</title>
</head>
 <style>
        #box{
            height:300px;
            width:300px;
            background-color: aqua;
            margin:200px 0 0 100px;
            border:5px solid red;
        }
    </style>
     <script>
        function eventcall(){
            alert("These are the mouse events");
        }
    </script>
<body>
    <div id= "box" onmouseover="eventcall()">This is section A </div>
    
</body>
</html>
